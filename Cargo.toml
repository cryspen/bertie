[package]
name = "bertie"
version = "0.1.0-pre.2"
authors = ["Karthikeyan Bhargavan <karthik@cryspen.com>"]
license = "Apache-2.0"
edition = "2021"
documentation = "https://docs.rs/bertie"
description = "Minimal TLS 1.3 implementation"
readme = "README.md"
repository = "https://github.com/cryspen/bertie"

[lib]
path = "src/lib.rs"

[dependencies]
backtrace = "0.3.0"
rand = "0.9"
hex = "0.4.3"
tracing = "0.1"
libcrux-kem = { version = "0.0.2", features = ["kyber"] }
libcrux-sha2 = { version = "0.0.3-alpha.1" }
libcrux-hmac = { version = "0.0.3-alpha.1" }
libcrux-hkdf = { version = "0.0.3-alpha.1" }
libcrux-chacha20poly1305 = { version = "0.0.2" }
libcrux-rsa = { version = "0.0.2" }
libcrux-ed25519 = { version = "0.0.3-alpha.1" }
libcrux-ecdsa = { version = "0.0.3-alpha.1", features = ["rand"] }
hax-lib = { version = "0.3" }
# Optional: when the `trace` feature is enabled, every serializer in
# `tls13formats.rs` registers a `Term::Struct { type_name: <fn>, fields:
# <args> }` against its output bytes' fingerprint via the
# `symbolic-trace` shadow map. The `bertie-trace-adapter` crate then picks
# up the rich call terms in `network_sink` events. Builds without this
# feature pay zero cost.
symbolic-trace = { path = "/Users/karthik/symbolic-trace/symbolic-trace", optional = true }
symbolic-trace-macros = { path = "/Users/karthik/symbolic-trace/symbolic-trace-macros", optional = true }
serde_json = { version = "1", optional = true, default-features = false, features = ["alloc"] }
# Bertie's trace_impls.rs ships hand-written `Serialize` impls for `Bytes`
# and `HandshakeData` so the symbolic-trace macro's byte-path walker can
# see them. Behind the `trace` feature only.
serde = { version = "1", optional = true, default-features = false }

[features]
default = ["api", "std", "defensive"]
defensive = []
std = []
test_utils = []
secret_integers = []
api = []
hax-fstar = []
hax-pv = []
trace = ["dep:symbolic-trace", "dep:symbolic-trace-macros", "dep:serde_json", "dep:serde", "std"]

[dev-dependencies]
bertie = { path = ".", features = ["test_utils"] }
dhat = "0.3.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
rayon = "1.3.0"
criterion = "0.5"
psm = "0.1.24"
bytesize = "1.3.0"

[[bench]]
name = "client"
harness = false

[[bench]]
name = "client_stack"
harness = false

[[bench]]
name = "server"
harness = false

[workspace]
members = [
    ".",
    "record",
    "simple_https_client",
    "simple_https_server",
    "bogo_shim",
    "integration_tests",
]

default-members = [
    ".",
    "record",
    "simple_https_client",
    "simple_https_server",
    "bogo_shim",
    "integration_tests",
]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(bench)', 'cfg(hax)'] }

# Use the in-tree hax-lib so the new pv_extern/pv_stub/pv_inverse_of macros are
# available before they ship to crates.io. Drop once published.
[patch.crates-io]
hax-lib = { path = "/Users/karthik/hax/.claude/worktrees/proverif-backend-update/hax-lib" }
hax-lib-macros = { path = "/Users/karthik/hax/.claude/worktrees/proverif-backend-update/hax-lib/macros" }
hax-lib-macros-types = { path = "/Users/karthik/hax/.claude/worktrees/proverif-backend-update/hax-lib/macros/types" }
